name: Publicar site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir regras editoriais
        run: npm run conferir
      - name: Gerar o site
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && vars.PUBLICAR_PAGES == 'sim'
        with:
          path: dist

  # Só publica quando a variável PUBLICAR_PAGES do repositório vale 'sim'
  # (Settings > Secrets and variables > Actions > Variables). Até lá, cada
  # envio apenas confere as regras editoriais e gera o site.
  publicar:
    if: github.event_name != 'pull_request' && vars.PUBLICAR_PAGES == 'sim'
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
